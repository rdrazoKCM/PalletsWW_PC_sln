<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Fondo Corporativo Kimberly-Clark -->
  <rect width="64" height="64" rx="14" fill="#0047AB" />
  <rect x="2" y="2" width="60" height="60" rx="12" stroke="#3C93CB" stroke-width="2" stroke-opacity="0.6" fill="none" />
  
  <!-- Icono de Tarima / Pallet Industrial con Cajas -->
  <!-- Base de Pallet (madera / soporte) -->
  <rect x="12" y="44" width="40" height="4" rx="1.5" fill="#E6F0FA" />
  <rect x="16" y="48" width="6" height="4" rx="1" fill="#CFE2F5" />
  <rect x="29" y="48" width="6" height="4" rx="1" fill="#CFE2F5" />
  <rect x="42" y="48" width="6" height="4" rx="1" fill="#CFE2F5" />
  <rect x="12" y="52" width="40" height="2" rx="1" fill="#3C93CB" />

  <!-- Cajas de Pañales estibadas -->
  <!-- Nivel inferior -->
  <rect x="14" y="30" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#003366" stroke-width="1.5" />
  <rect x="34" y="30" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#003366" stroke-width="1.5" />
  <path d="M14 36 h16 M34 36 h16" stroke="#3C93CB" stroke-width="1.5" stroke-dasharray="2 1" />
  
  <!-- Nivel superior -->
  <rect x="20" y="16" width="24" height="12" rx="2" fill="#E6F0FA" stroke="#003366" stroke-width="1.5" />
  <path d="M20 22 h24" stroke="#0047AB" stroke-width="1.5" stroke-dasharray="2 1" />
  
  <!-- Sello KC / Pañal (Cinta dorada / estrella) -->
  <circle cx="32" cy="22" r="3" fill="#F59E0B" />
</svg>